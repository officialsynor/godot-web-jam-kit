name: Export web build and deploy to itch.io

# Every push of a v* tag produces a fresh web build and (if credentials are
# configured) pushes it straight to itch.io. Manual runs are also allowed from
# the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # Pinned so a Godot release landing mid-jam cannot change your build.
      GODOT_VERSION: "4.7.2"
      BUTLER_VERSION: "15.32.0"
      # Referenced through env rather than directly, because GitHub refuses to
      # evaluate `secrets.*` inside an `if:` condition.
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ secrets.ITCH_USER }}
      ITCH_GAME: ${{ secrets.ITCH_GAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          # Godot looks for templates in a folder named after the version.
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import resources
        run: ~/godot/godot --headless --path . --import

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/butler.zip \
            "https://github.com/itchio/butler/releases/download/v${BUTLER_VERSION}/butler-linux-amd64.zip"
          unzip -q /tmp/butler.zip -d /tmp/butler
          /tmp/butler/linux-amd64/butler push build/web "$ITCH_USER/$ITCH_GAME:web"
